<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Website Title</title>
    <!-- Add Tailwind CSS styles -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Add any additional stylesheets you may need -->

    <!-- Add any custom CSS styles -->
    <style>
        /* Your custom styles here */
        /* Sidebar styling */
        .sidebar {
            width: 250px;
            transition: all 0.3s;
            position: fixed;
            top: 0;
            left: -250px;
            height: 100%;
            z-index: 1000;
        }

        .sidebar.show {
            left: 0;
        }

        /* Toggle button styling */
        #sidebarToggle {
            position: fixed;
            top: 15px;
            left: 15px;
            cursor: pointer;
            z-index: 1001;
            
        }

        /* Top bar styling */
        .top-bar {
            background-color: #333;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body class="bg-gray-100">
    <!-- Top Bar -->
    <div class="top-bar flex items-center justify-between bg-blue-500 text-white px-4 py-2">
        <!-- Hamburger toggle button -->
        <div id="sidebarToggle">
            <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
            </svg>
        </div>
        <!-- Search bar -->
        <div class="flex-1 px-4">
            <input type="text" placeholder="Search" class="w-full px-4 py-2 rounded bg-gray-200 text-black">
        </div>
        <!-- Login and notification icons -->
        <div class="flex items-center space-x-4">
            <button class="text-white">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 4c1.657 0 3 1.343 3 3v1c0 4.879-3.238 8.908-7.418 9.878-.202.048-.408.073-.582.073s-.38-.025-.582-.073C6.238 16.908 3 12.879 3 8V7c0-1.657 1.343-3 3-3h6zm0 0v13m0 0c0 2.206-1.794 4-4 4s-4-1.794-4-4"></path>
                </svg>
            </button>
            <button class="text-white">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 22s7-4 7-11V5l-7-3-7 3v6c0 7 7 11 7 11z"></path>
                </svg>
            </button>
            <!-- Add any additional icons or buttons as needed -->
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar bg-blue-500 text-white p-4">
        <!-- Sidebar Header (Logo) -->
        <h1 class="text-white font-bold text-xl mb-4">Schema Registry</h1>
        <!-- Sidebar Menu -->
        <ul class="space-y-2">
            <li><a href="#" class="flex items-center"><span class="mr-2">Dashboard</span></a></li>
            <li><a href="#" class="flex items-center"><span class="mr-2">Users</span></a></li>
            <li>
                <!-- Nested Sub-nav -->
                <span class="flex items-center cursor-pointer" onclick="toggleSubNav(this)">
                    <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5l7 7-7 7"></path>
                    </svg>
                    Nested Items
                </span>
                <ul class="pl-4" style="display: none;">
                    <li><a href="#" class="flex items-center"><span class="mr-2">Item 1</span></a></li>
                    <li><a href="#" class="flex items-center"><span class="mr-2">Item 2</span></a></li>
                </ul>
            </li>
            <!-- Add more sidebar items and nested sub-nav items as needed -->
        </ul>
    </div>

    <!-- Main content -->
    <main class="container mx-auto mt-20">
        <!-- Your content goes here -->
    </main>

    <!-- Add the necessary scripts before the closing body tag -->
    <!-- Add Tailwind CSS (already included above) -->
    <!-- Add any additional scripts or dependencies you may need -->
    <script>
        // Toggle sidebar visibility
        document.getElementById('sidebarToggle').addEventListener('click', function () {
            document.querySelector('.sidebar').classList.toggle('show');
        });

        // Toggle sub-navigation
        function toggleSubNav(element) {
            const subNav = element.nextElementSibling;
            subNav.style.display = subNav.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>

</html>
